name: Bug report
description: Report a reproducible problem with YGO Card Scanner.
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a problem.

        Issues are reserved for reproducible bugs. Please use **Discussions** for feature requests, questions, and general feedback. Do not report security vulnerabilities here; follow the private reporting instructions in [SECURITY.md](../../SECURITY.md).

  - type: checkboxes
    id: preliminary-checks
    attributes:
      label: Preliminary checks
      options:
        - label: I searched existing issues and did not find the same bug.
          required: true
        - label: This is a bug report, not a feature request, support request, or general question.
          required: true
        - label: I can reproduce the problem with the current version of the app.
          required: true

  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the problem clearly and concisely.
      placeholder: The app does ... when I ...
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: Give the smallest set of steps that consistently triggers the problem.
      value: |
        1.
        2.
        3.
      placeholder: Explain what you did, including any catalog-download, scan, or import action involved.
    validations:
      required: true

  - type: textarea
    id: expected-result
    attributes:
      label: Expected behaviour
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: textarea
    id: actual-result
    attributes:
      label: Actual behaviour
      description: What happened? Include any visible error message.
    validations:
      required: true

  - type: dropdown
    id: affected-area
    attributes:
      label: Affected area
      description: Where did you encounter the problem?
      options:
        - Collection or card details
        - Card search or catalog browser
        - Camera scanning
        - Bulk photo scanning
        - Catalog, price, or artwork downloads
        - Deck import or deck availability
        - Settings or language
        - Other
    validations:
      required: true

  - type: input
    id: app-version
    attributes:
      label: App version or commit
      description: Share the version shown by the app, or the Git commit if you built it yourself.
      placeholder: "Example: 0.1.0 or a1b2c3d"
    validations:
      required: true

  - type: input
    id: device-and-android-version
    attributes:
      label: Device and Android version
      description: Include the device model and Android version.
      placeholder: "Example: Pixel 8, Android 15"
    validations:
      required: true

  - type: textarea
    id: logs-or-media
    attributes:
      label: Logs, screenshots, or additional context
      description: Add relevant error text, screenshots, or recordings if safe to share. Please redact personal information.
      placeholder: Do not attach collection databases, backups, exports, API keys, signing material, or screenshots containing private collection data.
    validations:
      required: false

  - type: checkboxes
    id: privacy-check
    attributes:
      label: Privacy check
      options:
        - label: I have not included collection data, backups, exports, credentials, signing material, or personal information.
          required: true
